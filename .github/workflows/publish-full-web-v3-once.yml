name: Publish Full Web v3 into main once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-full-web-v3-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify Full Web artifact
        env:
          ARTIFACT_URL: 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-3e34-822f-8c54-4d37e6c58c48/raw?se=2026-10-06T02%3A24%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=954edd11-da5f-5663-b82f-f52bdd08636a&skoid=c69179d1-5b5d-430f-afa3-b9bdcf9d6497&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T01%3A51%3A56Z&ske=2026-10-07T01%3A51%3A56Z&sks=b&skv=2026-02-06&sig=68UrhPd3jUpAW8zDhEnji0ilvMMJmo40ExtcNqYn6bo%3D'
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$ARTIFACT_URL" -o /tmp/fullweb-artifact.zip
          echo '63d5612c90fca359c1f1a439428479d4bdc44ba4849dbbf693471c53408453e5  /tmp/fullweb-artifact.zip' | sha256sum -c -
          rm -rf /tmp/artifact /tmp/site
          mkdir -p /tmp/artifact /tmp/site
          unzip -q /tmp/fullweb-artifact.zip -d /tmp/artifact
          inner=$(find /tmp/artifact -type f -name '*.zip' | head -n 1)
          test -n "$inner"
          unzip -q "$inner" -d /tmp/site
          test -f /tmp/site/index.html
          test -f /tmp/site/sw.js
          test -f /tmp/site/manifest.webmanifest
          test -f /tmp/site/codec/excel-v8.wasm
          find /tmp/site/assets -maxdepth 1 -type f -name '*.wasm' | grep -q .
      - name: Replace connectivity test with verified Full Web
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch .
          cp -a /tmp/site/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'deploy: publish verified Full Web v3'
          git push origin HEAD:main
